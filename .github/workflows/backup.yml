name: backup
# Sealed, dated copies of the published data, kept apart from the `data` branch that every pass overwrites
# (docs/RESTORE.md). Each run copies the data branch's *.json and the repo's lock/*.json into <stamp>/ and
# <stamp>/lock/, refusing if any data file other than lock.json and inbox.json is not a sealed envelope, then:
#   - uploads it as the artifact backup-<stamp>, kept 2 days: the hourly tier. The live loop dispatches this
#     workflow when it starts and every 50 minutes (loop.yml), so the newest copy is under an hour old while the
#     loop runs; the hourly cron below is only a fallback (GitHub fires it a few times a day);
#   - when the backup branch holds no folder of this UTC day yet, puts the copy there too (the day's first), in
#     a normal commit that also drops what scripts/backup.mjs planRetention lets go (48 hours, the day's first
#     for 90 days, the week's first for a year, the newest). Only the branch's trees are fetched, never its files.
# Then a structural rehearsal of the copy (no decryption; the weekly restore-drill.yml decrypts).
# Public log: dates, counts and pass/fail only.
on:
  schedule:
    - cron: '17 * * * *'   # hourly fallback (best-effort)
  workflow_dispatch:
    inputs:
      by:
        description: 'who started this run'
        type: choice
        options: [manual, loop]
        default: manual
permissions:
  contents: write   # the day's first copy on the backup branch
concurrency:
  group: backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the scripts and the lock files
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Backup tests first (planted faults, e.g. an unsealed file must be refused; the retention's rules)
        run: node --test test/backup.test.mjs
      - name: Check out the data branch (as published)
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-branch
          fetch-depth: 1
          persist-credentials: false
      - name: Copy and check the seals
        id: stage
        env:
          BY: ${{ inputs.by || 'schedule' }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          echo "started by $BY; stamp $stamp"
          node scripts/backup.mjs make --data data-branch --lock lock --out stage --stamp "$stamp" --no-prune
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
      - name: Upload the hourly copy (kept 2 days)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ steps.stage.outputs.stamp }}
          path: stage/${{ steps.stage.outputs.stamp }}
          retention-days: 2
          if-no-files-found: error
      - name: Rehearse the copy (never decrypts; pass/fail and counts only)
        run: node scripts/backup.mjs rehearse --backups stage --lock lock --max-age-h 1
      - name: Check out the backup branch, trees only
        uses: actions/checkout@v5
        with:
          ref: backup
          path: backup-branch
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: README.md
          sparse-checkout-cone-mode: false
      - name: The day's first copy on the backup branch (and what the retention lets go)
        env:
          STAMP: ${{ steps.stage.outputs.stamp }}
        run: node scripts/backup.mjs daily --repo backup-branch --stage stage --stamp "$STAMP"
