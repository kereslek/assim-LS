name: diag
# Diagnostics for the cross-checks. Public market data only: counts, ratios, block numbers, status codes.
# parts: any of probe (price-history sources), events (v3 creation events per provider), scan (a fast
# pool list, then the full scan), spikes (fee spikes in the sealed history, scripts/feespike.mjs: opens the
# sealed data here and prints dates, ratios, spans and counts only). Inputs are public: never pass a private
# value here (pool: public market terms, "PAIR FEE CHAIN VERSION").
on:
  workflow_dispatch:
    inputs:
      parts:
        description: 'probe, events, scan, withevents, spikes (comma list)'
        default: 'probe'
      pool:
        description: 'spikes: the pool to look at, in public market terms'
        default: 'UNI/WETH 0.01 ethereum 3'
permissions:
  contents: read
concurrency:
  group: diag-${{ inputs.parts }}
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests first
        run: node --test test/*.test.mjs
      - name: Fee spikes (the sealed history opened here; public log dates, ratios, spans and counts only)
        if: contains(inputs.parts, 'spikes')
        env:
          LOCK_PASSPHRASE: ${{ secrets.LOCK_PASSPHRASE }}
          SPIKE_POOL: ${{ inputs.pool }}
        run: node scripts/publish-data.mjs --restore && node scripts/feespike.mjs
      - name: Price-history sources
        if: contains(inputs.parts, 'probe')
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: node scripts/diag.mjs probe
      - name: Pool list, fast (slow parts skipped)
        if: contains(inputs.parts, 'events') || contains(inputs.parts, 'scan')
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          POOLS_SKIP: ${{ contains(inputs.parts, 'withevents') && 'gecko' || contains(inputs.parts, 'scan') && 'events,gecko' || 'events,gecko,dexscreener' }}
        run: node scripts/pools.mjs || true
      - name: Creation events per provider
        if: contains(inputs.parts, 'events')
        run: node scripts/diag.mjs events
      - name: Price-history cache (public market prices; each token fetched at most once a day)
        if: contains(inputs.parts, 'scan')
        uses: actions/cache/restore@v4
        with:
          path: out/cache
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: Scan
        if: contains(inputs.parts, 'scan') && hashFiles('out/pools-ethereum.json') != ''
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
        run: node scripts/scan.mjs
      - name: Save the price-history cache
        if: always() && hashFiles('out/cache/history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: out/cache
          key: history-${{ github.run_id }}
