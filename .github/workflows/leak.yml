name: leak
# Leak check: no private string (the sealed config's leakSensitive values and every secret's value) in
# any branch's any file version, commit message, file or ref name, or in recent run logs. Prints counts
# and yes/no only; fails on a find, or when it could not read everything.
on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * 1'   # Mondays 04:37 UTC
permissions:
  contents: read
  actions: read
concurrency:
  group: leak
  cancel-in-progress: false
jobs:
  leak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # every branch and tag, full history
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Leak-check tests first (planted leaks must be found)
        run: node --test test/lock-leak.test.mjs
      - name: Leak check (counts and yes/no only)
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          LOCK_PASSPHRASE: ${{ secrets.LOCK_PASSPHRASE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/leak-check.mjs --logs 400
