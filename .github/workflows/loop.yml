name: loop
# The always-on scanner loop: one long job runs a pass every SPACING seconds for about 5 h 20 min, then
# dispatches its own successor (the one event the default token may start). The scripts come from the
# commit named in loop/PIN, checked out into pinned/, so later pushes don't change a running loop;
# promoting a version is a normal commit that edits loop/PIN.
# Rehearsal mode: 3 short passes of a dummy pass (one planted failure), publish as a dry run, no successor.
# Public log: pass/fail, counts, dates and timings (names and seconds) only; everything else is sealed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'rehearsal (3 short dummy passes, dry-run publish, no successor) or live'
        type: choice
        options: [rehearsal, live]
        default: rehearsal
      by:
        description: 'who started this run'
        type: choice
        options: [manual, self, watchdog]
        default: manual
  schedule:
    - cron: '23 */6 * * *'   # backup only: queues behind a running loop (one run at a time)
permissions:
  contents: write   # publish the sealed data branch
  actions: write    # dispatch the successor
  issues: write     # the passphrase mismatch alarm only (scripts/alarm.mjs): one issue, opened and closed
concurrency:
  group: loop
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ inputs.mode || 'live' }}
      BY: ${{ inputs.by || 'schedule' }}
      BRANCH: claude/ecstatic-dirac-wkrqja
      # the live pass: the pool list when it is over 6 hours old, then the scan (maps, fees, windows, sealed outputs)
      LIVE_PASS: 'if [ ! -f out/pools-ethereum.json ] || [ $(( $(date +%s) - $(stat -c %Y out/pools-ethereum.json) )) -gt 21600 ]; then node scripts/pools.mjs; fi && node scripts/scan.mjs'
    steps:
      - name: Read the pinned commit
        uses: actions/checkout@v5
        with:
          sparse-checkout: loop
          persist-credentials: false
      - name: Which code runs
        id: pin
        run: |
          sha=$(tr -d '[:space:]' < loop/PIN)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo 'loop/PIN holds a commit SHA: no'; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "mode $MODE, started by $BY; pinned code ${sha:0:12}"
      - name: Check out the pinned scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pin.outputs.sha }}
          path: pinned
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Restore the market-data caches (public prices and counts; each token's history once a UTC day)
        uses: actions/cache/restore@v4
        with:
          path: pinned/out/cache
          key: loop-cache-${{ github.run_id }}
          restore-keys: loop-cache-
      - name: Unit tests first (the pinned code; a broken check never reads real data)
        working-directory: pinned
        run: node --test test/*.test.mjs
      - name: Start the sealed copies (backup.yml now and every 2 hours while the loop runs)
        # docs/RESTORE.md: the newest copy stays under about 2 hours old while the loop runs (every 50 minutes until
        # 28 Nov 2026; every 2 hours since, for less Actions time); GitHub's cron alone
        # fires a few times a day. A background timer only: it never touches the pass, and a failure here never
        # stops the loop (continue-on-error). The token reaches the timer only, not the pass.
        if: env.MODE == 'live'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          nohup setsid bash -c '
            end=$(( $(date +%s) + 6 * 3600 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              if gh workflow run backup.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f by=loop >/dev/null 2>&1; then echo "yes $(date -u +%H:%M)"; s=7200
              else echo "no $(date -u +%H:%M)"; s=300; fi
              sleep "$s"
            done' > "$RUNNER_TEMP/hourly-copies.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/hourly-copies.pid"
          echo 'hourly copies: started (backup.yml now, then every 2 hours while the loop runs)'
      - name: Loop
        working-directory: pinned
        env:
          LOCK_PASSPHRASE: ${{ secrets.LOCK_PASSPHRASE }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}   # optional: without it the token links use CoinGecko
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}   # optional: the D1 archive (lib/d1.mjs); without them it is skipped
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ "$MODE" = rehearsal ]; then
            REHEARSAL_FAIL_PASS=2 node scripts/loop.mjs --mode rehearsal --by "$BY" --pass 'node scripts/loop.mjs rehearsal-pass' --spacing 30 --max-passes 3 --dry-run
          else
            node scripts/loop.mjs --mode live --by "$BY" --pass "$LIVE_PASS" --spacing 360 --deadline-min 320 --pass-timeout-min 50
          fi
      - name: Passphrase mismatch alarm (the readable flag and one issue; cleared on the first pass that opens)
        if: always() && env.MODE == 'live'
        continue-on-error: true
        working-directory: pinned
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f scripts/alarm.mjs ]; then node scripts/alarm.mjs; else echo 'alarm: not in this pinned code'; fi
      - name: Stop the hourly sealed copies
        if: always() && env.MODE == 'live'
        continue-on-error: true
        run: |
          pid=$(cat "$RUNNER_TEMP/hourly-copies.pid" 2>/dev/null || true)
          if [ -n "$pid" ]; then kill -- "-$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true; fi
          log="$RUNNER_TEMP/hourly-copies.log"
          yes=$(grep -c '^yes ' "$log" 2>/dev/null || true); no=$(grep -c '^no ' "$log" 2>/dev/null || true)
          echo "hourly copies dispatched by this run: ${yes:-0} yes, ${no:-0} no; last: $(tail -n 1 "$log" 2>/dev/null || echo none)"
      - name: Publish the loop's own sealed log
        if: always()
        working-directory: pinned
        env:
          LOCK_PASSPHRASE: ${{ secrets.LOCK_PASSPHRASE }}
        run: |
          if [ -z "$(ls out/data 2>/dev/null)" ]; then echo 'sealed files to publish: none'; exit 0; fi
          # a real push only in live mode with a live pass wired in; otherwise a dry run. --own-keys: the loop's
          # keys.json (guest slots, the data key) is the one to publish; older pinned code ignores the flag
          if [ "$MODE" = live ] && [ -n "$LIVE_PASS" ]; then node scripts/publish-data.mjs --own-keys; else node scripts/publish-data.mjs --dry-run; fi
      - name: Save the market-data caches for the next run
        if: always() && hashFiles('pinned/out/cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: pinned/out/cache
          key: loop-cache-${{ github.run_id }}
      - name: Hand over to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          next=$(cat pinned/out/loop/successor 2>/dev/null || echo no)
          if [ "$MODE" != live ]; then echo 'successor dispatched: no (rehearsal)'; exit 0; fi
          if [ "$next" != yes ]; then echo 'successor dispatched: no (the loop ran under 30 minutes or had nothing to run; the watchdog covers it)'; exit 0; fi
          if gh workflow run loop.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" -f mode=live -f by=self; then
            echo 'successor dispatched: yes'
          else
            echo 'successor dispatched: no (dispatch failed; the watchdog covers it)'
          fi
