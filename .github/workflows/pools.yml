name: pools
on:
  push:
    paths: ['scripts/pools.mjs', 'scripts/scan.mjs', '.github/workflows/pools.yml']   # lib changes: dispatch a run when needed
  workflow_dispatch:
permissions:
  contents: write   # publish the sealed data branch (the owner approved replacing it each pass)
concurrency:
  group: pools
  cancel-in-progress: false
jobs:
  pools:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests first (a broken check never reads real data)
        run: node --test test/*.test.mjs
      - name: Market-data caches (public prices, the universe and the day's API counts; each token's history once a day)
        uses: actions/cache/restore@v4
        with:
          path: out/cache
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: The loop's market-data caches too (for its universe, if newer than this workflow's own)
        uses: actions/cache/restore@v4
        with:
          path: pinned/out/cache
          key: loop-cache-${{ github.run_id }}
          restore-keys: loop-cache-
      - name: Keep the newer cached universe of the two (CoinGecko's monthly quota out leaves the cache to serve)
        run: |
          node -e '
            const fs = require("fs"), t = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")).t || 0; } catch { return 0; } };
            const own = t("out/cache/universe.json"), loop = t("pinned/out/cache/universe.json");
            if (loop > own) { fs.mkdirSync("out/cache", { recursive: true }); fs.copyFileSync("pinned/out/cache/universe.json", "out/cache/universe.json"); }
            const age = (ms) => (ms ? `${((Date.now() - ms) / 86400e3).toFixed(1)} days old` : "none");
            console.log(`cached universe: this workflow ${age(own)}, the loop ${age(loop)}; using ${loop > own ? "the loop" : own ? "this workflow" : "none"}`);'
          rm -rf pinned
      - name: Pool list (public market data only)
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: node scripts/pools.mjs
      - name: Restore the sealed data (snapshots and the last live.json)
        if: always() && hashFiles('out/pools-ethereum.json') != ''
        env:
          LOCK_PASSPHRASE: ${{ secrets.LOCK_PASSPHRASE }}
        run: node scripts/publish-data.mjs --restore
      - name: Liquidity maps, fees and windows (public log pass/fail and counts only; details sealed)
        if: always() && hashFiles('out/pools-ethereum.json') != ''
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
          LOCK_PASSPHRASE: ${{ secrets.LOCK_PASSPHRASE }}
        run: node scripts/scan.mjs
      - name: Publish the sealed data to the data branch
        if: always() && hashFiles('out/data/live.json') != ''
        env:
          LOCK_PASSPHRASE: ${{ secrets.LOCK_PASSPHRASE }}
        run: node scripts/publish-data.mjs
      - name: Save the market-data caches (the universe, the API counts with CoinGecko's monthly mark, each token's history)
        if: always() && hashFiles('out/cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: out/cache
          key: history-${{ github.run_id }}
