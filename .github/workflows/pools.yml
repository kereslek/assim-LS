name: pools
on:
  push:
    paths: ['scripts/pools.mjs', 'scripts/scan.mjs', '.github/workflows/pools.yml']   # lib changes: dispatch a run when needed
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pools
  cancel-in-progress: false
jobs:
  pools:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests first (a broken check never reads real data)
        run: node --test test/*.test.mjs
      - name: Pool list (public market data only)
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: node scripts/pools.mjs
      - name: Price-history cache (public market prices; each token fetched at most once a day)
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: out/cache
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: Liquidity maps and a day of fees (public market data only)
        if: always() && hashFiles('out/pools-ethereum.json') != ''
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: node scripts/scan.mjs
      - name: Save the price-history cache
        if: always() && hashFiles('out/cache/history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: out/cache
          key: history-${{ github.run_id }}
