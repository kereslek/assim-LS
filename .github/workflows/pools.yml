name: pools
on:
  push:
    paths: ['scripts/pools.mjs', 'scripts/scan.mjs', 'lib/**', '.github/workflows/pools.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pools
  cancel-in-progress: true
jobs:
  pools:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests first (a broken check never reads real data)
        run: node --test test/*.test.mjs
      - name: Pool list (public market data only)
        env:
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
        run: node scripts/pools.mjs
      - name: Liquidity maps and a day of fees (public market data only)
        if: always() && hashFiles('out/pools-ethereum.json') != ''
        run: node scripts/scan.mjs
