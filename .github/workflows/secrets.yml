name: secrets
# Prints only yes/no per secret. Never a value, a length or a prefix.
on:
  push:
    paths: ['.github/workflows/secrets.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  present:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          LOCK_PASSPHRASE: ${{ secrets.LOCK_PASSPHRASE }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
        run: |
          bad=0
          for n in LOCK_PASSPHRASE COINGECKO_KEY ETHERSCAN_KEY; do
            if [ -n "${!n}" ]; then echo "$n present: yes"; else echo "$n present: no"; bad=1; fi
          done
          v="$LOCK_PASSPHRASE"
          if [ "${#v}" -ge 20 ]; then echo "LOCK_PASSPHRASE at least 20 characters: yes"; else echo "LOCK_PASSPHRASE at least 20 characters: no"; bad=1; fi
          case "$v$COINGECKO_KEY$ETHERSCAN_KEY" in *[[:space:]]*|*\"*|*\'*) echo "stray spaces or quotes: yes"; bad=1;; *) echo "stray spaces or quotes: no";; esac
          exit $bad
