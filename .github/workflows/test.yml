name: test
on:
  push:
    paths: ['lib/**', 'test/**', 'scripts/**', '.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
